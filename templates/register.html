<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Güvenli Mesajlaşma - Kayıt</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="cyber-grid"></div>
    <div class="scan-line"></div>
    
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo-section">
                <div class="logo-icon">🔒</div>
                <h1 class="logo-text">Secure<span>MSG</span></h1>
                <p class="logo-subtitle">Yeni Hesap Oluştur</p>
            </div>
            
            <form method="POST" class="auth-form">
                <h2>Kayıt Ol</h2>
                
                {% if error %}
                <div class="error-message">
                    <span class="error-icon">⚠️</span>
                    {{ error }}
                </div>
                {% endif %}
                
                <div class="form-group">
                    <label for="username">
                        <span class="label-icon">👤</span>
                        Kullanıcı Adı
                    </label>
                    <input type="text" id="username" name="username" required 
                           placeholder="En az 3 karakter" minlength="3" autocomplete="username">
                    <div class="input-glow"></div>
                </div>
                
                <div class="form-group">
                    <label for="password">
                        <span class="label-icon">🔐</span>
                        Şifre
                    </label>
                    <input type="password" id="password" name="password" required 
                           placeholder="En az 6 karakter" minlength="6" autocomplete="new-password">
                    <div class="input-glow"></div>
                </div>
                
                <div class="form-group">
                    <label for="confirm_password">
                        <span class="label-icon">🔑</span>
                        Şifre Tekrar
                    </label>
                    <input type="password" id="confirm_password" name="confirm_password" required 
                           placeholder="Şifrenizi tekrar girin" autocomplete="new-password">
                    <div class="input-glow"></div>
                </div>
                
                <button type="submit" class="btn-primary">
                    <span class="btn-text">Kayıt Ol</span>
                    <span class="btn-icon">→</span>
                </button>
            </form>
            
            <div class="auth-footer">
                <p>Zaten hesabınız var mı? <a href="{{ url_for('login') }}">Giriş Yap</a></p>
            </div>
            
            <div class="security-badge">
                <span class="badge-icon">🛡️</span>
                <span>Güvenli Kayıt</span>
            </div>
        </div>
    </div>
    
    <script>
        // Add cyber effect to inputs
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.classList.add('focused');
            });
            input.addEventListener('blur', function() {
                this.parentElement.classList.remove('focused');
            });
        });
        
        // Password match validation
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirm_password');
        
        confirmPassword.addEventListener('input', function() {
            if (this.value !== password.value) {
                this.setCustomValidity('Şifreler eşleşmiyor');
            } else {
                this.setCustomValidity('');
            }
        });
    </script>
</body>
</html>
